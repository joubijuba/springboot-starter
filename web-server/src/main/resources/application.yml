spring:
  datasource:
    url: jdbc:postgresql://localhost:5332/${POSTGRES_DB} 
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate # Will enforce schemas / types matching between SQL tables and @Entity classes before Spring Boot starts
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration